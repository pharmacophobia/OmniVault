<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="50%" stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#89dceb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#313244" stroke-width="4"/>

  <!-- Outer Shield Outline -->
  <path d="M 256 64 
           C 340 64, 400 90, 420 120 
           C 420 270, 370 380, 256 448 
           C 142 380, 92 270, 92 120 
           C 112 90, 172 64, 256 64 Z" 
        fill="url(#shield-grad)" 
        filter="url(#glow)"
        opacity="0.3"/>

  <!-- Main Shield -->
  <path d="M 256 80 
           C 330 80, 385 102, 402 130 
           C 402 260, 358 360, 256 424 
           C 154 360, 110 260, 110 130 
           C 127 102, 182 80, 256 80 Z" 
        fill="url(#inner-grad)" 
        stroke="url(#shield-grad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Padlock Shackle -->
  <path d="M 204 220 
           V 180 
           C 204 150, 226 128, 256 128 
           C 286 128, 308 150, 308 180 
           V 220" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="18" 
        stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="180" y="220" width="152" height="130" rx="24" fill="#313244" stroke="url(#gold-grad)" stroke-width="8"/>

  <!-- Keyhole Center -->
  <circle cx="256" cy="272" r="16" fill="url(#gold-grad)"/>
  <path d="M 250 278 L 262 278 L 266 312 L 246 312 Z" fill="url(#gold-grad)"/>

  <!-- Cyber Accents / Circuits -->
  <circle cx="256" cy="380" r="6" fill="#89b4fa"/>
  <line x1="256" y1="350" x2="256" y2="374" stroke="#89b4fa" stroke-width="4" stroke-dasharray="4,4"/>
  <circle cx="160" cy="285" r="5" fill="#a6e3a1"/>
  <line x1="160" y1="285" x2="135" y2="285" stroke="#a6e3a1" stroke-width="3"/>
  <circle cx="352" cy="285" r="5" fill="#a6e3a1"/>
  <line x1="352" y1="285" x2="377" y2="285" stroke="#a6e3a1" stroke-width="3"/>
</svg>
